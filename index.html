<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recomendación de Cultivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans">

  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-2xl">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Formulario de Cultivo</h1>

    <form id="cropForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Nitrógeno -->
      <input type="number" name="N" placeholder="Nitrógeno (N)" required
        class="p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500" />

      <!-- Fósforo -->
      <input type="number" name="P" placeholder="Fósforo (P)" required
        class="p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500" />

      <!-- Potasio -->
      <input type="number" name="K" placeholder="Potasio (K)" required
        class="p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500" />

      <!-- Temperatura -->
      <input type="number" step="0.1" name="temperature" placeholder="Temperatura (°C)" required
        class="p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500" />

      <!-- Humedad -->
      <input type="number" step="0.1" name="humidity" placeholder="Humedad (%)" required
        class="p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500" />

      <!-- pH -->
      <input type="number" step="0.1" name="ph" placeholder="pH del suelo" required
        class="p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500" />

      <!-- Lluvia -->
      <input type="number" step="0.1" name="rainfall" placeholder="Lluvia (mm)" required
        class="p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500" />

      <!-- Selección del modelo -->
      <select name="model" id="model" required
        class="p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 col-span-1 md:col-span-2">
        <option value="rf">Random Forest</option>
        <option value="svc">SVM</option>
      </select>

      <!-- Botón -->
      <div class="col-span-1 md:col-span-2 text-center mt-4">
        <button type="submit" 
          class="bg-green-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-green-700 transition">
          Enviar
        </button>
      </div>
    </form>
  </div>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-2xl p-6 w-96 shadow-lg">
      <h2 class="text-xl font-bold mb-4 text-gray-800">Respuesta del servidor</h2>
      <pre id="modalMessage" class="bg-gray-100 p-4 rounded-lg text-sm overflow-auto"></pre>
      <div class="text-right mt-4">
        <button onclick="closeModal()" 
          class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
          Cerrar
        </button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("cropForm");
    const modal = document.getElementById("modal");
    const modalMessage = document.getElementById("modalMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      // Convertir a número
      data.N = parseInt(data.N);
      data.P = parseInt(data.P);
      data.K = parseInt(data.K);
      data.temperature = parseFloat(data.temperature);
      data.humidity = parseFloat(data.humidity);
      data.ph = parseFloat(data.ph);
      data.rainfall = parseFloat(data.rainfall);

      // Obtener modelo seleccionado
      const model = formData.get("model");

      try {
        const response = await fetch(`https://randomforest-corp.onrender.com//predict?model=${model}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        const result = await response.json();

        modalMessage.textContent = JSON.stringify(result, null, 2);
        modal.classList.remove("hidden");
      } catch (error) {
        modalMessage.textContent = "Error al conectar con la API: " + error;
        modal.classList.remove("hidden");
      }
    });

    function closeModal() {
      modal.classList.add("hidden");
    }
  </script>
</body>
</html>
